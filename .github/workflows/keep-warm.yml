name: Keep the API awake

# Render's free plan stops a service after 15 minutes without requests, and the next visitor then
# waits about a minute. Pinging /health every 14 minutes keeps it ready.
# Set the repository variable API_HEALTH_URL (Settings > Secrets and variables > Actions > Variables),
# e.g. https://agri-loan-desk-api.onrender.com/health. Without it this workflow does nothing.

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_HEALTH_URL != '' }}
    steps:
      - run: curl --fail --silent --show-error --max-time 90 "${{ vars.API_HEALTH_URL }}"
