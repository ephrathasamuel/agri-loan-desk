name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: API tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agriloan
          POSTGRES_PASSWORD: agriloan
          POSTGRES_DB: agriloan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agriloan -d agriloan_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://agriloan:agriloan@localhost:5432/agriloan_test' || '' }}
        run: pytest -q

  web:
    name: Web lint, build and end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install API
        working-directory: api
        run: pip install -r requirements.txt
      - name: Install web
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Build
        working-directory: web
        run: npm run build
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: web
        env:
          # Throwaway values for this CI run only.
          E2E_ADMIN_EMAIL: e2e-admin@example.com
          E2E_ADMIN_PASSWORD: e2e-password-123
          SECRET_KEY: ci-only-secret-key
        run: npm run test:e2e

  docker:
    name: Docker images build on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        env:
          POSTGRES_PASSWORD: ci-only
          SECRET_KEY: ci-only
        run: docker compose build
